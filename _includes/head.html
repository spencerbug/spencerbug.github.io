<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- seo -%}

  <script>
    (function () {
      try {
        var saved = localStorage.getItem("site-theme");
        var theme = saved === "light" || saved === "dark"
          ? saved
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      } catch (_) {
        document.documentElement.dataset.theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
    })();
  </script>

  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/quizzes.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site-fixes.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/public-site.css' | relative_url }}">
  <script defer src="{{ '/assets/theme.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/breadcrumbs.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/annotations.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/blog-annotations.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/quizzes.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/quizzes-extra.js' | relative_url }}"></script>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
  <script type="module" src="{{ '/assets/mermaid.js' | relative_url }}"></script>

  {%- if page.plotly -%}
  <script defer src="https://cdn.plot.ly/plotly-4.0.0.min.js" charset="utf-8"></script>
  <script defer src="{{ '/assets/pcfh-visualizer.js' | relative_url }}"></script>
  {%- endif -%}

  {%- if page.rpr_visualizer -%}
  <script defer src="{{ '/assets/rpr-visualizer.js' | relative_url }}"></script>
  {%- endif -%}

  {%- feed_meta -%}

  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>
