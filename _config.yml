title: Spencer Neilan
email: spencer.neilan@gmail.com
description: >-
  Embedded Linux, platform firmware, low-level systems, networking, embedded security,
  and embodied intelligence.
baseurl: ""
url: "https://spencerbug.github.io"
twitter_username: spencer_neilan
github_username: spencerbug
instagram_username: spencerbug0

# Build settings
theme: minima
plugins:
  - jekyll-feed

collections:
  issues:
    output: true
    permalink: /issues/:name/

defaults:
  - scope:
      path: ""
      type: issues
    values:
      layout: issue

# Explicit top-level navigation. Course content lives beneath /courses/.
header_pages:
  - blog.md
  - courses/index.md
  - issues/index.md
  - about.markdown
  - site.markdown
